<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task Board - Enterprise Task Suite</title>
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="board.css">
</head>
<body>

  <!-- Navigation -->
  <nav class="top-nav">
    <a href="../index.html" class="nav-brand">
      <svg viewBox="0 0 24 24" fill="none" stroke="url(#nav-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="9" rx="1"></rect>
        <rect x="14" y="3" width="7" height="5" rx="1"></rect>
        <rect x="14" y="12" width="7" height="9" rx="1"></rect>
        <rect x="3" y="16" width="7" height="5" rx="1"></rect>
      </svg>
      <span>TaskSuite</span>
    </a>
    <div class="nav-links">
      <a href="../user-dashboard/index.html" class="nav-link">Dashboard</a>
      <a href="index.html" class="nav-link active">Task Board</a>
      <a href="../admin-panel/index.html" class="nav-link">Admin Console</a>
    </div>
  </nav>

  <div class="container">
    
    <!-- Controls Header -->
    <header class="board-header">
      <div class="search-filters">
        <div class="search-input-wrapper glass-card">
          <svg style="width: 18px; height: 18px; color: var(--text-muted);" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" id="search-input" placeholder="Search tasks...">
        </div>
        
        <div class="select-wrapper glass-card">
          <select id="priority-filter">
            <option value="all">All Priorities</option>
            <option value="high">High Priority</option>
            <option value="medium">Medium Priority</option>
            <option value="low">Low Priority</option>
          </select>
        </div>
      </div>
      
      <button class="btn btn-primary" id="open-create-modal-btn">
        <svg style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        New Task
      </button>
    </header>

    <!-- Kanban Board Grid -->
    <main class="board-grid">
      
      <!-- Todo Column -->
      <div class="board-column glass-card" data-column="todo">
        <div class="column-header">
          <div class="column-title-wrap">
            <span class="column-indicator indicator-todo"></span>
            <h3>To Do</h3>
          </div>
          <span class="column-count" id="count-todo">0</span>
        </div>
        <div class="cards-container" id="tasks-todo">
          <!-- Dynamically filled with task cards -->
        </div>
      </div>

      <!-- In Progress Column -->
      <div class="board-column glass-card" data-column="in-progress">
        <div class="column-header">
          <div class="column-title-wrap">
            <span class="column-indicator indicator-progress"></span>
            <h3>In Progress</h3>
          </div>
          <span class="column-count" id="count-in-progress">0</span>
        </div>
        <div class="cards-container" id="tasks-in-progress">
          <!-- Dynamically filled with task cards -->
        </div>
      </div>

      <!-- In Review Column -->
      <div class="board-column glass-card" data-column="in-review">
        <div class="column-header">
          <div class="column-title-wrap">
            <span class="column-indicator indicator-review"></span>
            <h3>In Review</h3>
          </div>
          <span class="column-count" id="count-in-review">0</span>
        </div>
        <div class="cards-container" id="tasks-in-review">
          <!-- Dynamically filled with task cards -->
        </div>
      </div>

      <!-- Done Column -->
      <div class="board-column glass-card" data-column="done">
        <div class="column-header">
          <div class="column-title-wrap">
            <span class="column-indicator indicator-done"></span>
            <h3>Done</h3>
          </div>
          <span class="column-count" id="count-done">0</span>
        </div>
        <div class="cards-container" id="tasks-done">
          <!-- Dynamically filled with task cards -->
        </div>
      </div>

    </main>
  </div>

  <!-- Create Task Modal -->
  <div class="modal-overlay" id="create-modal">
    <div class="glass-card modal-container animate-float">
      <div class="modal-header">
        <h3>Create New Task</h3>
        <button class="modal-close-btn" id="close-create-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <form id="create-task-form">
        <div class="form-group">
          <label for="task-title">Title</label>
          <input type="text" id="task-title" required placeholder="Describe task in brief">
        </div>
        
        <div class="form-row">
          <div class="form-group">
            <label for="task-priority">Priority</label>
            <select id="task-priority">
              <option value="low">Low</option>
              <option value="medium" selected>Medium</option>
              <option value="high">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="task-date">Due Date</label>
            <input type="date" id="task-date" required>
          </div>
        </div>

        <div class="form-group">
          <label for="task-desc">Description</label>
          <textarea id="task-desc" rows="3" placeholder="Provide description details..."></textarea>
        </div>

        <div class="form-group">
          <label for="task-tags">Tags (comma separated)</label>
          <input type="text" id="task-tags" placeholder="e.g. Design, Backend, Auth">
        </div>

        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="cancel-create-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Create Task</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Task Detail Modal -->
  <div class="modal-overlay" id="detail-modal">
    <div class="glass-card modal-container modal-detail-container">
      <div class="modal-header">
        <span class="badge" id="detail-priority-badge">High</span>
        <button class="modal-close-btn" id="close-detail-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>
      <div class="detail-body">
        <h2 class="detail-title" id="detail-title">Task Title Details</h2>
        <div class="detail-metadata">
          <div class="meta-item">
            <span class="meta-lbl">Due Date:</span>
            <span id="detail-date" class="meta-val">2026-06-25</span>
          </div>
          <div class="meta-item">
            <span class="meta-lbl">Column:</span>
            <span id="detail-column" class="meta-val">To Do</span>
          </div>
        </div>
        
        <div class="detail-section">
          <h4 class="section-title">Description</h4>
          <p class="section-desc" id="detail-desc">No description provided.</p>
        </div>

        <div class="detail-section">
          <h4 class="section-title">Tags</h4>
          <div class="tags-container" id="detail-tags">
            <!-- tags dynamically inserted -->
          </div>
        </div>

        <div class="detail-section">
          <h4 class="section-title">Subtasks / Checklists</h4>
          <div class="subtasks-input-wrap">
            <input type="text" id="new-subtask-input" placeholder="Add subtask...">
            <button class="btn btn-secondary" id="add-subtask-btn">Add</button>
          </div>
          <div class="subtasks-list" id="detail-subtasks">
            <!-- checklists dynamically filled -->
          </div>
        </div>
      </div>
      <div class="modal-footer detail-footer">
        <button class="btn btn-danger" id="delete-task-btn">
          <svg style="width:16px;height:16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
          Delete Task
        </button>
        <button class="btn btn-secondary" id="close-detail-footer-btn">Close</button>
      </div>
    </div>
  </div>

  <!-- Reusable Gradients -->
  <svg style="width:0;height:0;position:absolute;" aria-hidden="true" focusable="false">
    <linearGradient id="nav-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
  </svg>

  <script src="board.js"></script>
</body>
</html>
